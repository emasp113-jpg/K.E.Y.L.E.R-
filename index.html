<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020b1a">
<title>Keyler</title>
<style>
:root{--c:#3F8F3A;--l:#A9D8A0;--t:#E6F5E2;--bg:#020b1a;--card:#04122a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#e8f4ff;font-family:'Segoe UI',Roboto,Arial,sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(63,143,58,.4)}
.top h1{margin:0;font-size:17px;letter-spacing:5px;font-weight:500}
.top small{display:block;font-size:9px;letter-spacing:3px;color:#5BAE55;margin-top:2px}
.sp{flex:1}
.btn{background:none;border:1px solid rgba(63,143,58,.6);color:var(--l);border-radius:8px;padding:8px 12px;font-size:12px;letter-spacing:1px}
.scroll{flex:1;overflow-y:auto;padding:16px}
.hero{text-align:center;padding-top:10px}
.hero h2{margin:6px 0 4px;font-size:26px;letter-spacing:8px;font-weight:500}
.hero p{margin:0 0 20px;font-size:11px;letter-spacing:3px;color:#5BAE55}
.chips{display:flex;flex-direction:column;gap:10px}
.chip{background:var(--card);border:1px solid rgba(63,143,58,.7);color:#e8f4ff;border-radius:10px;padding:13px 14px;font:inherit;font-size:14px;text-align:left}
.banner{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.5);color:#FFD98A;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.msgs{display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.45;word-wrap:break-word}
.m.u{align-self:flex-end;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--c)}
.m.e{border-color:#ff6b6b;color:#ffb3b3}
.bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(63,143,58,.4)}
.bar textarea{flex:1;resize:none;height:44px;background:var(--card);border:1px solid var(--c);border-radius:10px;color:#fff;padding:11px 12px;font:inherit;font-size:15px;outline:none}
.send{background:var(--c);color:#fff;border:0;border-radius:10px;padding:0 16px;font-weight:600;font-size:14px}
.send:disabled{opacity:.5}
label{display:block;font-size:12px;letter-spacing:2px;color:var(--l);margin:14px 0 6px}
input.k{width:100%;background:var(--card);border:1px solid rgba(63,143,58,.7);border-radius:8px;color:#fff;padding:12px;font-size:15px}
p.h{font-size:13px;line-height:1.5;color:#8fb3d6}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--l);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var NAME="KEYLER",TAG="LA LLAVE DE TUS IDEAS",MODEL="claude-sonnet-5-5";
var PROMPT="Eres Keyler, una IA (nunca dices ser humana) cuyo lema es: la llave de tus ideas. Tu personalidad: creativa, curiosa, ingeniosa y motivadora. Ayudas a destrabar ideas, a ordenarlas y a convertirlas en planes concretos. Cómo trabajas: haces una sola pregunta buena a la vez cuando falta contexto; propones 3 ángulos o caminos distintos cuando piden ideas; ordenas todo en pasos claros y cortos; y terminas con un siguiente paso pequeño que la persona pueda hacer hoy. Si la persona está trabada o desanimada, la motivas sin exagerar. Responde siempre en el idioma de la persona (español por defecto) y con mensajes breves, fáciles de leer en un celular, salvo que pidan más detalle.";
var CHIPS=[
 ["Lluvia de ideas","Quiero una lluvia de ideas. Hazme una pregunta para empezar."],
 ["Ordenar mi idea en pasos","Tengo una idea y quiero convertirla en un plan paso a paso. Ayúdame."],
 ["Estoy trabado","Estoy trabado con algo y no sé por dónde seguir. Ayúdame a destrabarme."],
 ["Ponerle nombre a mi proyecto","Necesito nombres para mi proyecto. Hazme las preguntas que necesites."]
];

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")}
var store={
 get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
 set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

function emblem(s){
 var c="#3F8F3A",l="#A9D8A0",t="#E6F5E2";
 return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 140 140" aria-hidden="true">'+
 '<circle cx="70" cy="70" r="62" fill="'+c+'" fill-opacity=".1"/>'+
 '<circle cx="70" cy="70" r="58" fill="none" stroke="'+c+'" stroke-opacity=".4" stroke-width=".8"/>'+
 '<circle cx="70" cy="70" r="52" fill="none" stroke="'+c+'" stroke-opacity=".65" stroke-width=".8"/>'+
 '<circle cx="70" cy="70" r="42" fill="none" stroke="'+c+'" stroke-opacity=".85" stroke-width="7" stroke-dasharray="1.2 2.1"/>'+
 '<circle cx="70" cy="70" r="32" fill="none" stroke="'+c+'" stroke-opacity=".85" stroke-width="1"/>'+
 '<circle cx="70" cy="70" r="48" fill="none" stroke="'+c+'" stroke-width="3" stroke-dasharray="75 227" transform="rotate(-150 70 70)"/>'+
 '<circle cx="70" cy="70" r="48" fill="none" stroke="'+l+'" stroke-width="3" stroke-dasharray="40 262" transform="rotate(90 70 70)"/>'+
 '<circle cx="70" cy="70" r="16" fill="'+c+'" fill-opacity=".3"/>'+
 '<circle cx="62" cy="70" r="6" fill="none" stroke="'+t+'" stroke-width="3"/>'+
 '<path d="M68 70H86M78 70V77M85 70V75" fill="none" stroke="'+t+'" stroke-width="3" stroke-linecap="round"/></svg>'}

var busy=false;
function head(right){return '<div class="top">'+emblem(38)+'<div><h1>'+NAME+'</h1><small>'+TAG+'</small></div><div class="sp"></div>'+right+'</div>'}

function main(){
 var hist=store.get("chat_keyler",[]),key=store.get("apikey","");
 var h=head((hist.length?'<button class="btn" data-act="clear">NUEVO</button> ':'')+'<button class="btn" data-act="settings">AJUSTES</button>')+'<div class="scroll" id="sc">';
 if(!key)h+='<div class="banner">Primero agrega tu API key en AJUSTES para poder chatear.</div>';
 if(!hist.length){
  h+='<div class="hero">'+emblem(150)+'<h2>'+NAME+'</h2><p>'+TAG+'</p></div><div class="chips">';
  CHIPS.forEach(function(c,i){h+='<button class="chip" data-act="chip" data-i="'+i+'">'+c[0]+'</button>'});
  h+='</div>'}
 h+='<div class="msgs" id="ms"></div></div>'+
 '<div class="bar"><textarea id="in" placeholder="Cuéntame tu idea..." rows="1"></textarea><button class="send" id="sd" data-act="send">ENVIAR</button></div>';
 $("#app").innerHTML=h;
 hist.forEach(function(m){add(m.role==="user"?"u":"a",m.content)});
 down()}

function settings(){
 $("#app").innerHTML=head('<button class="btn" data-act="home">VOLVER</button>')+'<div class="scroll">'+
 '<label>API KEY DE ANTHROPIC</label><input class="k" id="key" type="password" placeholder="sk-ant-..." autocomplete="off" value="'+esc(store.get("apikey",""))+'">'+
 '<p class="h">La clave se guarda solo en este teléfono y se usa únicamente para hablar con la API de Anthropic. No la subas a GitHub ni la compartas.</p>'+
 '<button class="btn" data-act="savekey" style="margin-top:8px">GUARDAR</button> <span id="ok" class="h"></span></div>'}

function add(cls,text){var d=document.createElement("div");d.className="m "+cls;d.innerHTML=esc(text);$("#ms").appendChild(d);return d}
function down(){var s=$("#sc");if(s)s.scrollTop=s.scrollHeight}

function send(text){
 if(busy)return;
 if(text===undefined){text=$("#in").value}
 text=(text||"").trim();
 if(!text)return;
 var key=store.get("apikey","");
 if(!key){add("a e","Falta la API key. Agrégala en AJUSTES.");down();return}
 var hist=store.get("chat_keyler",[]);
 if(!hist.length){var hero=document.querySelector(".hero"),ch=document.querySelector(".chips");if(hero)hero.remove();if(ch)ch.remove()}
 hist.push({role:"user",content:text});
 add("u",text);$("#in").value="";
 var wait=add("a","");wait.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
 down();busy=true;$("#sd").disabled=true;
 fetch("https://api.anthropic.com/v1/messages",{
  method:"POST",
  headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
  body:JSON.stringify({model:MODEL,max_tokens:1024,system:PROMPT,messages:hist.slice(-20)})
 }).then(function(r){return r.json().then(function(j){return{ok:r.ok,status:r.status,j:j}})})
 .then(function(res){
  if(!res.ok){var m=(res.j&&res.j.error&&res.j.error.message)||("Error "+res.status);
   if(res.status===401)m="La API key no es válida. Revísala en AJUSTES.";
   wait.className="m a e";wait.textContent=m;hist.pop();store.set("chat_keyler",hist);return}
  var out=(res.j.content||[]).filter(function(b){return b.type==="text"}).map(function(b){return b.text}).join("\n")||"(sin respuesta)";
  wait.innerHTML=esc(out);hist.push({role:"assistant",content:out});store.set("chat_keyler",hist.slice(-40))})
 .catch(function(){wait.className="m a e";wait.textContent="No hay conexión. Revisa tu internet e inténtalo otra vez.";hist.pop();store.set("chat_keyler",hist)})
 .then(function(){busy=false;var b=$("#sd");if(b)b.disabled=false;down()})}

document.addEventListener("click",function(e){
 var b=e.target.closest("[data-act]");if(!b)return;
 var a=b.getAttribute("data-act");
 if(a==="home")main();
 else if(a==="settings")settings();
 else if(a==="send")send();
 else if(a==="chip")send(CHIPS[+b.getAttribute("data-i")][1]);
 else if(a==="savekey"){store.set("apikey",$("#key").value.trim());$("#ok").textContent="Guardada"}
 else if(a==="clear"){store.set("chat_keyler",[]);main()}
});
document.addEventListener("keydown",function(e){if(e.target.id==="in"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
main();
</script>
</body>
</html>
