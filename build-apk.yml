name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar archivos web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Poner el logo de Keyler
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png splash.png assets/
          npx @capacitor/assets generate --android --iconBackgroundColor '#050807' --splashBackgroundColor '#050807'

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Keyler-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
